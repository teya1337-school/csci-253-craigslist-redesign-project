<main class="directory-page">
  <div class="page-shell">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a routerLink="/">Home</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">{{ category().label }}</span>
    </nav>

    <header class="page-heading">
      <p class="eyebrow">Category</p>
      <h1>{{ category().label }}</h1>
      <p>{{ category().description }}</p>
    </header>

    <section aria-labelledby="post-types-heading">
      <h2 id="post-types-heading">Types</h2>

      @for (destination of destinations(); track destination.path) {
        <a class="directory-card" [routerLink]="destination.path">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="12"></circle>
              <path d="M10 13h12M10 18h8"></path>
            </svg>
          </span>
          <span class="card-copy">
            <strong>{{ destination.typeLabel }}</strong>
            <span>{{ destination.description }}</span>
          </span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </a>
      }
    </section>
  </div>
</main>
